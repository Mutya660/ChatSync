# ═══════════════════════════════════════════════════════════════
#  ChatSync 1.7.2 — config by mutya660
#  Modrinth: https://modrinth.com/plugin/chatsync
#  Github:   https://github.com/Mutya660/ChatSync
#
#  [EN] Language texts (errors, usage, GUI) → lang/<code>.yml
#  [RU] Тексты (ошибки, подсказки, GUI) → lang/<code>.yml
# ═══════════════════════════════════════════════════════════════

# ── Language / Язык ───────────────────────────────────────────
# [EN] Server language for ALL players and console. No auto-detect.
#      Supported: en, ru, de, fr
# [RU] Язык сервера для ВСЕХ игроков и консоли. Без автоопределения.
#      Поддерживается: en, ru, de, fr
language: "ru"

# ── Chat ──────────────────────────────────────────────────────
chat:
  heads:
    # [EN] Player head icons in chat (Paper + client 1.21.9+)
    # [RU] Иконки голов в чате
    enabled: true
    force_first: true
    gap: " "
    debug: false
    fallback: ""

  # [EN] Channel without prefix when require_symbol=true: local | global
  # [RU] Канал без префикса при require_symbol=true: local | global
  default_channel: "local"

  global:
    # [EN] false = global chat off (only local + team)
    # [RU] false = глобал выключен (только локал + team)
    enabled: true
    # [EN] true = need symbol (e.g. !) for global; false = use default_channel for all
    # [RU] true = нужен символ (!); false = всё идёт в default_channel
    require_symbol: true
    symbol: "!"
    # Placeholders: %head% %player% %message% %luckperms_prefix% %luckperms_suffix% {username-color}
    format: "%head%&8[&aG&8] %luckperms_prefix% {username-color}%player% %luckperms_suffix%&7 » &f%message%"
    cooldown: 3

  local:
    # [EN] false = local off (everything goes global if global.enabled)
    # [RU] false = локал выкл (всё в глобал, если global.enabled)
    enabled: true
    radius: 100.0
    cooldown: 2
    format: "%head%&8[&fL&8] %luckperms_prefix% {username-color}%player% %luckperms_suffix%&7 » &f%message%"
    log_to_console: true
    console_format: "[LocalChat] %player%: %message%"

  me:
    format: "%head%&7* %player% %message%"
    radius: -1

# ── Private messages ──────────────────────────────────────────
pm:
  format_spy: "%head%&8[SPY] &7%sender% &8→ &7%receiver%&8: &7%message%"
  format_spy_local: "%head%&8[SPY-L] &7%player%&8: &7%message%"
  format_spy_team: "%head%&8[SPY-T] &7%player%&8: &7%message%"
  format_spy_me: "%head%&8[SPY-ME] &7* %player% &7%message%"
  sound:
    enable: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2

# ── Discord (DiscordSRV soft-depend) ──────────────────────────
discord:
  enabled: true

# ── Death / Advancement ───────────────────────────────────────
death_messages:
  # [EN] Translate deaths when language=ru (JSON packs in JAR)
  # [RU] Перевод смертей при language=ru
  translate: true
  translate_to_russian: false
  # [EN] Heads in death messages (in-game only; Discord/console clean)
  # [RU] Головы в смертях (только в игре)
  show_heads: true

advancement_messages:
  show_heads: true

# ── Join / Quit ───────────────────────────────────────────────
messages:
  join: "%head%&a→ &f%player%"
  quit: "%head%&c← &f%player%"

# ── System messages (GM / TP) ─────────────────────────────────
system_messages:
  # [EN] Only staff with see_permission see these in chat. Console always logs.
  # [RU] В чате видит только стафф с правом. Консоль всегда пишет лог.
  staff_only: true
  see_permission: "chatsync.system.see"
  # [EN] Intercept /gamemode /gm /tp and suppress vanilla feedback
  # [RU] Перехват /gamemode /gm /tp — без ванильных сообщений
  intercept_commands: true
  gamemode:
    enabled: true
    # [EN] Announce GM changes not done via command (plugins) — also helps if intercept missed
    # [RU] Анонс смены режима не через команду + если перехват не сработал
    announce_non_command: true
    format: "%head%&7%player% &8→ &f%mode%"
    format_creative: "%head%&7%player% &8→ &aCREATIVE"
    format_survival: "%head%&7%player% &8→ &eSURVIVAL"
    format_adventure: "%head%&7%player% &8→ &bADVENTURE"
    format_spectator: "%head%&7%player% &8→ &8SPECTATOR"
  teleport:
    enabled: true
    cross_world_only: false
    include_portals: false
    announce_non_command: true
    # Placeholders: %head% %player% %world% %x% %y% %z% %from% %to%
    format: "%head%&7%player% &8→ &f%world% &7%x%&8, &7%y%&8, &7%z%"
    # [EN] When teleporting to a player — %target% is clickable (runs /tp <name>)
    # [RU] Теп к игроку — %target% кликабельный (/tp <ник>)
    format_to_player: "%head%&7%player% &8→ &f%target% &8(&7%world% %x%&8, &7%y%&8, &7%z%&8)"
    click_hover: "&7Клик: телепорт к &f%player%"

# ── GUI (/chatsync gui) ───────────────────────────────────────
gui:
  enabled: true
  permission: "chatsync.gui"
  permission_unmute: "chatsync.gui.unmute"
  # [EN] Max entries loaded into top pages
  # [RU] Макс. записей в топах
  top_limit: 200
  # [EN] Items per page
  # [RU] Предметов на странице
  page_size: 45

# ── Commands permissions ──────────────────────────────────────
commands:
  reload:
    permission: "chatsync.admin"
  msg:
    console_permission: "chatsync.msg.console"
  me:
    permission: "chatsync.me"
  clear:
    permission: "chatsync.clear"
  chatstats:
    permission: "chatsync.chatstats"
    permission_others: "chatsync.chatstats.others"
    permission_reset: "chatsync.chatstats.reset"
  chatstatstop:
    permission: "chatsync.chatstatstop"
  broadcast:
    permission: "chatsync.broadcast"
    permission_preset: "chatsync.broadcast.preset"
  playtime:
    permission: "chatsync.playtime"
  playtimetop:
    permission: "chatsync.playtimetop"
  lastseen:
    permission: "chatsync.lastseen"

# ── Spam protection ───────────────────────────────────────────
spam:
  enabled: true
  # [EN] Identical message repeat window (seconds)
  # [RU] Окно повтора одинаковых сообщений (сек)
  repeat_seconds: 3
  max_repeats: 2
  notify:
    enabled: true
    permission: "chatsync.spam.notify"

# ── Stats ─────────────────────────────────────────────────────
stats:
  enabled: true
  save_interval: 300
  top_size: 10

# ── Playtime ──────────────────────────────────────────────────
playtime:
  enabled: true
  save_interval: 300

# ── Logging (file) ────────────────────────────────────────────
logging:
  enabled: true
  folder: "logs"
  async: true

# ── Broadcast ─────────────────────────────────────────────────
broadcast:
  show_sender: true
  actionbar: false
  title:
    enable: false
    text: "%message%"
    subtitle: ""
  sound:
    enable: false
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0
  presets:
    restart_5m: "&c&lServer restarting in 5 minutes!"
    restart_1m: "&c&lServer restarting in 1 minute!"
    maintenance: "&e&lServer is under maintenance."

# ── Hover on clickable names (TAB-style) ──────────────────────
# [EN] Tooltip when hovering a clickable name in chat / commands.
# [RU] Подсказка при наведении на кликабельный ник.
hover:
  enabled: true
  show_playtime: true
  # [EN] Multi-line like TAB. Placeholders: %player% %playtime% %playtime_seconds% %uuid%
  #      Empty list → use hover.format, then lang messages.join_hover*
  # [RU] Многострочный hover как в TAB. Пустой список → format → lang
  lines:
    - "&f%player%"
    - "&8%playtime%"
  # [EN] Single string alternative (use \n for new lines). Used if lines is empty.
  # [RU] Одна строка с \n, если lines пустой
  format: ""

# ── Toggles ───────────────────────────────────────────────────
toggles:
  local_noone: true
  join_message: true
  quit_message: true
  ignore_notify_sender: true
  ignore_notify_target: false
  pm_sound: true
  socialspy: true
  local_console_log: true
  clickable_death_name: true
  clickable_advancement_name: true

# ── Teams ─────────────────────────────────────────────────────
teams:
  enabled: true
  permission: "chatsync.team"
  permission_create: "chatsync.team.create"
  permission_admin: "chatsync.team.admin"
  max_teams: 50
  max_members: 8
  max_co_owners: 3
  max_name_length: 16
  default_symbol: "#"
  symbol_pool: "#$~@%^*"
  chat_symbol: "#"
  invite_timeout: 60
  default_color: "&b"
  allow_color_change: true
  persist: true
  format: "%head%&8[%color%%team%&8] &f%player%&7: &f%message%"

# ── Clickable names ───────────────────────────────────────────
clickable_names:
  enabled: true
  click_command: "/msg %player% "
  click_action: "SUGGEST_COMMAND"
  heads_in_commands: true

# ── Ignore ────────────────────────────────────────────────────
ignore:
  click_to_unignore: true
  click_on_added_message: true
  allow_offline: true
  max_ignored: 0

# ── Console PM ────────────────────────────────────────────────
console_pm:
  enabled: true
  show_head: true
  head_name: "Console"
  head_uuid: "00000000-0000-0000-0000-0000000000c0"
  head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOGExNjAzOGJjOGU2NTE4YWZhOTE0OThkYWI3Njc1YzAxY2IzMWExMjVkMjFjNDliODYxMjk0ZDM5ZTFjNTYwYyJ9fX0="
  head_signature: ""
  console_format: "&8[&eChatSync&8] &7PM from &f%player%&7: &f%message%"
  log_to_file: true
  count_stats: true

# ── Vanish ────────────────────────────────────────────────────
vanish:
  hide_join_quit: true
  hide_lastseen_online: true
  see_permissions:
    - "sv.see"
    - "pv.see"
    - "essentials.vanish.see"
    - "chatsync.vanish.see"

# ── SocialSpy ─────────────────────────────────────────────────
socialspy:
  permission: "chatsync.spy"
  local_chat: true
  me: true
  team_chat: true

# ── Advanced ──────────────────────────────────────────────────
advanced:
  color_permission: "chatsync.color"
  debug: false
