# ═══════════════════════════════════════════════════════════════
#  ChatSync 1.7.2 — Configuration
#  Modrinth: https://modrinth.com/plugin/chatsync
#  Github:   https://github.com/Mutya660/ChatSync
#
#  Localized player-facing text lives in lang/<code>.yml
#  This file controls formats, permissions, toggles and behaviour.
# ═══════════════════════════════════════════════════════════════

# Server language for all players and console.
# Supported: en, ru, de, fr, es, pt, pl, it, uk, zh, ja, tr, nl, cs
language: "en"

# ── Chat ──────────────────────────────────────────────────────
chat:
  heads:
    # Player head icons in chat (Paper + client 1.21.9+)
    enabled: true
    # Always put head first even without %head% in format
    force_first: true
    gap: " "
    debug: false
    # Fallback if head cannot render ("" = nothing)
    fallback: ""

  # Channel used when the message has no global prefix: local | global
  default_channel: "local"

  global:
    # false = global chat disabled (local + team only)
    enabled: true
    # true = require symbol (e.g. !) for global; false = use default_channel for everything
    require_symbol: true
    symbol: "!"
    # Placeholders: %head% %player% %message% %luckperms_prefix% %luckperms_suffix% {username-color}
    format: "%head%&8[&aG&8] %luckperms_prefix% {username-color}%player% %luckperms_suffix%&7 » &f%message%"
    # Seconds between global messages. 0 = off. Bypass: chatsync.bypass_cooldown
    cooldown: 3

  local:
    # false = local disabled (everything goes global if global.enabled)
    enabled: true
    radius: 100.0
    cooldown: 2
    format: "%head%&8[&fL&8] %luckperms_prefix% {username-color}%player% %luckperms_suffix%&7 » &f%message%"
    log_to_console: true
    console_format: "[LocalChat] %player%: %message%"

  me:
    format: "%head%&7* %player% %message%"
    radius: -1

# ── Private messages ──────────────────────────────────────────
pm:
  format_spy: "%head%&8[SPY] &7%sender% &8→ &7%receiver%&8: &7%message%"
  format_spy_local: "%head%&8[SPY-L] &7%player%&8: &7%message%"
  format_spy_team: "%head%&8[SPY-T] &7%player%&8: &7%message%"
  format_spy_me: "%head%&8[SPY-ME] &7* %player% &7%message%"
  sound:
    enable: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2

# ── Discord (DiscordSRV soft-depend) ──────────────────────────
discord:
  enabled: true

# ── Death / Advancement ───────────────────────────────────────
death_messages:
  # Translate death messages when language supports a JSON pack (e.g. ru)
  translate: true
  translate_to_russian: false
  # Heads in death messages (in-game only; Discord/console stay clean)
  show_heads: true

advancement_messages:
  show_heads: true

# ── Join / Quit ───────────────────────────────────────────────
messages:
  join: "%head%&a→ &f%player%"
  quit: "%head%&c← &f%player%"

# ── GUI (/chatsync gui) ───────────────────────────────────────
gui:
  enabled: true
  permission: "chatsync.gui"
  permission_unmute: "chatsync.gui.unmute"
  top_limit: 200
  page_size: 45

# ── Command permissions ───────────────────────────────────────
commands:
  reload:
    permission: "chatsync.admin"
  msg:
    console_permission: "chatsync.msg.console"
  me:
    permission: "chatsync.me"
  clear:
    permission: "chatsync.clear"
  chatstats:
    permission: "chatsync.chatstats"
    permission_others: "chatsync.chatstats.others"
    permission_reset: "chatsync.chatstats.reset"
  chatstatstop:
    permission: "chatsync.chatstatstop"
  broadcast:
    permission: "chatsync.broadcast"
    permission_preset: "chatsync.broadcast.preset"
  playtime:
    permission: "chatsync.playtime"
  playtimetop:
    permission: "chatsync.playtimetop"
  lastseen:
    permission: "chatsync.lastseen"

# ── Spam protection ───────────────────────────────────────────
spam:
  enabled: true
  repeat_seconds: 3
  max_repeats: 2
  notify:
    enabled: true
    permission: "chatsync.spam.notify"

# ── Stats ─────────────────────────────────────────────────────
stats:
  enabled: true
  save_interval: 300
  top_size: 10
  reset_confirm_timeout: 15

# ── Playtime ──────────────────────────────────────────────────
playtime:
  enabled: true
  save_interval: 300
  top_size: 10

# ── File logging ──────────────────────────────────────────────
logging:
  enabled: true
  folder: "logs"
  async: true

# ── Broadcast ─────────────────────────────────────────────────
broadcast:
  show_sender: true
  actionbar: false
  title:
    enable: false
    text: "%message%"
    subtitle: ""
  sound:
    enable: false
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0
  presets:
    restart_5m: "&c&lServer restarting in 5 minutes!"
    restart_1m: "&c&lServer restarting in 1 minute!"
    maintenance: "&e&lServer is under maintenance."

# ── Hover on clickable names (TAB-style) ──────────────────────
hover:
  enabled: true
  show_playtime: true
  # Multi-line hover. Placeholders: %player% %playtime% %playtime_seconds% %uuid%
  # Empty list → hover.format → lang messages.join_hover*
  lines:
    - "&f%player%"
    - "&8%playtime%"
  format: ""

# ── Feature toggles ───────────────────────────────────────────
toggles:
  local_noone: true
  join_message: true
  quit_message: true
  ignore_notify_sender: true
  ignore_notify_target: false
  pm_sound: true
  socialspy: true
  local_console_log: true
  clickable_death_name: true
  clickable_advancement_name: true

# ── Teams ─────────────────────────────────────────────────────
teams:
  enabled: true
  permission: "chatsync.team"
  permission_create: "chatsync.team.create"
  permission_admin: "chatsync.team.admin"
  max_teams: 50
  max_members: 8
  max_co_owners: 3
  max_name_length: 16
  default_symbol: "#"
  symbol_pool: "#$~@%^*"
  chat_symbol: "#"
  invite_timeout: 60
  default_color: "&b"
  allow_color_change: true
  persist: true
  format: "%head%&8[%color%%team%&8] &f%player%&7: &f%message%"

# ── Clickable names ───────────────────────────────────────────
clickable_names:
  enabled: true
  click_command: "/msg %player% "
  click_action: "SUGGEST_COMMAND"
  heads_in_commands: true

# ── Ignore ────────────────────────────────────────────────────
ignore:
  click_to_unignore: true
  click_on_added_message: true
  allow_offline: true
  max_ignored: 0

# ── Console private messages ──────────────────────────────────
console_pm:
  enabled: true
  show_head: true
  head_name: "Console"
  head_uuid: "00000000-0000-0000-0000-0000000000c0"
  head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOGExNjAzOGJjOGU2NTE4YWZhOTE0OThkYWI3Njc1YzAxY2IzMWExMjVkMjFjNDliODYxMjk0ZDM5ZTFjNTYwYyJ9fX0="
  head_signature: ""
  console_format: "&8[&eChatSync&8] &7PM from &f%player%&7: &f%message%"
  log_to_file: true
  count_stats: true

# ── Vanish ────────────────────────────────────────────────────
vanish:
  hide_join_quit: true
  hide_lastseen_online: true
  see_permissions:
    - "sv.see"
    - "pv.see"
    - "essentials.vanish.see"
    - "chatsync.vanish.see"

# ── SocialSpy ─────────────────────────────────────────────────
socialspy:
  permission: "chatsync.spy"
  local_chat: true
  me: true
  team_chat: true

# ── Advanced ──────────────────────────────────────────────────
advanced:
  color_permission: "chatsync.color"
  debug: false
