# ═══════════════════════════════════════════════════════════════
#  ChatSync - Configuration by mutya660
#  Modrinth: https://modrinth.com/plugin/chatsync
#
#  Every setting below has a bilingual comment:
#  [EN] English explanation
#  [RU] Пояснение на русском
#
#  NOTE / ПРИМЕЧАНИЕ:
#  [EN] The actual localized text shown to players (usage hints, errors,
#       success messages) lives in lang/<code>.yml so it can be translated
#       per-locale. This file only holds FORMATS, PERMISSIONS, COLORS,
#       TOGGLES and other non-localized behaviour settings.
#  [RU] Локализованный текст, который видят игроки (подсказки, ошибки,
#       сообщения об успехе), хранится в lang/<code>.yml, чтобы его можно
#       было переводить под каждый язык. Этот файл содержит только ФОРМАТЫ,
#       ПРАВА, ЦВЕТА, ПЕРЕКЛЮЧАТЕЛИ и прочие нелокализуемые настройки поведения.
# ═══════════════════════════════════════════════════════════════

# [EN] Default language for console and when auto_language is false / locale unsupported.
#      Supported: en, ru, de, fr
# [RU] Язык по умолчанию для консоли и когда auto_language выкл / локаль неподдерживаемая.
#      Поддерживается: en, ru, de, fr
language: "en"
# [EN] true = messages follow the player's client language (Minecraft settings).
#      false = always use `language` above for everyone.
# [RU] true = язык сообщений как в настройках клиента игрока.
#      false = у всех всегда язык из `language` выше.
auto_language: true

# ── Chat ──────────────────────────────────────────────────────
chat:
  global:
    # [EN] Whether a message must start with the symbol below to be sent to global chat
    # [RU] Должно ли сообщение начинаться с символа ниже, чтобы попасть в глобальный чат
    require_symbol: true
    # [EN] The symbol that marks a message as global (e.g. "!hello")
    # [RU] Символ, который делает сообщение глобальным (например, "!привет")
    symbol: "!"
    # [EN] Global chat format. Placeholders: %player%, %message%, %luckperms_prefix%, %luckperms_suffix%
    # [RU] Формат глобального чата. Плейсхолдеры: %player%, %message%, %luckperms_prefix%, %luckperms_suffix%
    format: "&8[&aG&8] %luckperms_prefix% &7%player% %luckperms_suffix%&7 > &7%message%"
    # [EN] Cooldown in seconds between global messages per player. 0 = disabled.
    #      Players with chatsync.bypass_cooldown permission are exempt.
    # [RU] Кулдаун в секундах между глобальными сообщениями одного игрока. 0 = отключено.
    #      Игроки с правом chatsync.bypass_cooldown освобождены от кулдауна.
    cooldown: 3
  local:
    # [EN] Radius (in blocks) within which local chat messages are visible
    # [RU] Радиус (в блоках), в пределах которого видны сообщения локального чата
    radius: 100.0
    # [EN] Slowmode: seconds between local chat messages. 0 = disabled.
    #      Bypass permission: chatsync.bypass_cooldown
    # [RU] Slowmode: секунды между сообщениями в локальном чате. 0 = выкл.
    #      Обход: chatsync.bypass_cooldown
    cooldown: 2
    # [EN] Local chat format shown to players
    # [RU] Формат локального чата, который видят игроки
    format: "&8[&fL&8] %luckperms_prefix% &f%player% %luckperms_suffix%&f > &f%message%"
    # [EN] Whether to also print local chat messages to the console log
    # [RU] Дублировать ли сообщения локального чата в лог консоли
    log_to_console: true
    # [EN] Format used when printing local chat to console
    # [RU] Формат, используемый при выводе локального чата в консоль
    console_format: "[LocalChat] %player%: %message%"
  # [EN] Settings for the /me roleplay command
  # [RU] Настройки команды /me (сообщения от третьего лица)
  me:
    # [EN] Format of /me messages. Placeholders: %player%, %message%
    # [RU] Формат сообщений /me. Плейсхолдеры: %player%, %message%
    format: "&7* %player% %message%"
    # [EN] Radius in blocks for who can see /me messages. -1 = visible to everyone on the server
    # [RU] Радиус в блоках для видимости сообщений /me. -1 = видно всем на сервере
    radius: -1

# ── Private messages ──────────────────────────────────────────
pm:
  # [EN] Format shown to staff with /socialspy for private messages
  # [RU] Формат, который видят администраторы через /socialspy для личных сообщений
  format_spy: "&8[SPY] &7%sender% &8→ &7%receiver%&8: &7%message%"
  # [EN] Format for local chat messages shown to admins with /socialspy (out-of-radius listeners)
  # [RU] Формат для сообщений локального чата, которые видят администраторы через /socialspy (вне радиуса)
  format_spy_local: "&8[SPY-L] &7%player%&8: &7%message%"
  sound:
    # [EN] Whether to play a sound to the receiver of a private message
    # [RU] Проигрывать ли звук получателю личного сообщения
    enable: true
    # [EN] Bukkit Sound enum name
    # [RU] Название звука из перечисления Bukkit Sound
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2

# ── Discord (DiscordSRV) ───────────────────────────────────────
discord:
  # [EN] Master switch for forwarding chat/me/broadcast messages to Discord via DiscordSRV
  # [RU] Общий переключатель отправки сообщений чата/me/broadcast в Discord через DiscordSRV
  enabled: true

# ── Death messages ──────────────────────────────────────────────
death_messages:
  # [EN] Translate death messages according to `language` above.
  #      language: "en" → uses death_messages_ru.json + entity_names_ru.json
  #      language: "en" (default) → vanilla Minecraft text (client-localized), clickable names only
  # [RU] Переводить сообщения о смерти по `language` выше.
  #      language: "ru" → пакет death_messages_ru.json + entity_names_ru.json
  #      language: "en" (по умолчанию) → ванильный текст (локаль клиента), только кликабельные ники
  translate: true
  # [EN] Legacy: if true and `translate` key is absent, force Russian pack
  # [RU] Старый ключ: если true и нет `translate` — принудительно русский пакет
  translate_to_russian: false

# ── Join / Quit messages ──────────────────────────────────────
messages:
  # [EN] Join message format. Placeholder: %player%
  # [RU] Формат сообщения о входе. Плейсхолдер: %player%
  join: "&a+ &f%player%"
  # [EN] Quit message format. Placeholder: %player%
  # [RU] Формат сообщения о выходе. Плейсхолдер: %player%
  quit: "&c- &f%player%"

# ── Commands: configurable permission nodes ────────────────────
# [EN] Lets you rename which permission node each command checks,
#      without touching plugin.yml or the Java code.
# [RU] Позволяет переопределить право, которое проверяет каждая команда,
#      без изменения plugin.yml или Java-кода.
commands:
  reload:
    permission: "chatsync.admin"
  me:
    permission: "chatsync.me"
  clear:
    permission: "chatsync.clear"
  chatstats:
    permission: "chatsync.chatstats"
    permission_others: "chatsync.chatstats.others"
    permission_reset: "chatsync.chatstats.reset"
  broadcast:
    permission: "chatsync.broadcast"
    permission_preset: "chatsync.broadcast.preset"
  playtime:
    permission: "chatsync.playtime"
    playtimetop:
      permission: "chatsync.playtimetop"
    lastseen:
      permission: "chatsync.lastseen"
# ── /clear ───────────────────────────────────────────────────
clear:
  # [EN] How many blank lines to push into chat when clearing
  # [RU] Сколько пустых строк отправлять в чат при очистке
  lines: 150
  # [EN] Seconds a pending /clear confirmation stays valid before expiring
  # [RU] Сколько секунд действует запрос на подтверждение /clear, прежде чем он истечёт
  confirm_timeout: 15
  # [EN] When clearing chat for everyone, notify all players who did it (true)
  #      or only notify the command sender (false)
  # [RU] При очистке чата для всех — уведомлять всех игроков, кто это сделал (true),
  #      или уведомлять только того, кто выполнил команду (false)
  broadcast_notice: true

# ── Chat statistics (/chatstats) ────────────────────────────────
stats:
  # [EN] Whether message statistics are tracked and periodically saved to stats.yml
  # [RU] Собирать ли статистику сообщений и периодически сохранять её в stats.yml
  enabled: true
  # [EN] How often (in seconds) to asynchronously flush stats to disk. Minimum 30.
  # [RU] Как часто (в секундах) асинхронно сохранять статистику на диск. Минимум 30.
  save_interval: 300
  # [EN] Number of entries shown by the /chatstats leaderboard
  # [RU] Количество записей, показываемых в топе /chatstats
  top_size: 10
  # [EN] Seconds a pending /chatstats reset all confirmation stays valid
  # [RU] Сколько секунд действует подтверждение /chatstats reset all
  reset_confirm_timeout: 15

# ── Spam staff notifications ────────────────────────────────────
# [EN] Admins with the permission receive chat alerts when a player spamms
#      (same message, CAPS, or flood) in global/local chat, /me or PMs.
# [RU] Админы с правом получают уведомления в чат, когда игрок спамит
#      (одно сообщение, КАПС или флуд) в глобальном/локальном чате, /me или ЛС.
spam:
  notify:
    enabled: true
    permission: "chatsync.spam.notify"
    # [EN] Time window (seconds) for counting repeated / flood messages
    # [RU] Окно времени (секунды) для подсчёта повторов / флуда
    window_seconds: 10
    # [EN] Same message repeated this many times → alert
    # [RU] Одно и то же сообщение столько раз → алерт
    same_message_limit: 3
    # [EN] Any messages this many times in the window → flood alert
    # [RU] Любые сообщения столько раз в окне → алерт о флуде
    flood_limit: 6
    # [EN] Ratio of uppercase letters (0.0–1.0) to treat as CAPS spam
    # [RU] Доля заглавных букв (0.0–1.0) для определения КАПСа
    caps_ratio: 0.7
    # [EN] Minimum length of message to check for CAPS
    # [RU] Минимальная длина сообщения для проверки на КАПС
    caps_min_length: 6
# ── Playtime tracking (/playtime, /playtimetop, /lastseen) ─────
playtime:
  # [EN] Whether playtime is tracked and periodically saved to playtime.yml
  # [RU] Отслеживать ли playtime и периодически сохранять его в playtime.yml
  enabled: true
  # [EN] How often (in seconds) to asynchronously flush playtime to disk. Minimum 30.
  # [RU] Как часто (в секундах) асинхронно сохранять playtime на диск. Минимум 30.
  save_interval: 300
  # [EN] Number of entries shown by the /playtimetop leaderboard
  # [RU] Количество записей, показываемых в топе /playtimetop
  top_size: 10
# ── Chat logging (async files in the "logs" folder) ─────────────
logging:
  # [EN] Whether global/local chat, PMs, /me and /broadcast are written to log files
  # [RU] Записывать ли глобальный/локальный чат, ЛС, /me и /broadcast в файлы лога
  enabled: true
  # [EN] Sub-folder (inside the plugin's data folder) where daily log files are stored
  # [RU] Подпапка (внутри папки данных плагина), куда сохраняются ежедневные файлы лога
  folder: "logs"
  # [EN] Write logs asynchronously (recommended — avoids blocking the main server thread)
  # [RU] Писать логи асинхронно (рекомендуется — не блокирует основной поток сервера)
  async: true

# ── Optional integrations ───────────────────────────────────────
integrations:
  luckperms:
    # [EN] Master switch for LuckPerms-related behaviour
    # [RU] Общий переключатель поведения, связанного с LuckPerms
    enabled: true
    # [EN] If PlaceholderAPI is NOT installed but LuckPerms is, resolve
    #      %luckperms_prefix% / %luckperms_suffix% directly via the LuckPerms API
    # [RU] Если PlaceholderAPI НЕ установлен, но LuckPerms есть — обрабатывать
    #      %luckperms_prefix% / %luckperms_suffix% напрямую через API LuckPerms
    use_api_directly: true
  coreprotect:
    # [EN] Master switch for CoreProtect-related behaviour
    # [RU] Общий переключатель поведения, связанного с CoreProtect
    enabled: true
    # [EN] Log every confirmed /clear execution into CoreProtect for /co lookup
    # [RU] Записывать каждое подтверждённое выполнение /clear в CoreProtect для /co lookup
    log_clear: true
  litebans:
    # [EN] Respect LiteBans mutes in chat, /me and private messages
    #      (required because ChatSync fully handles the chat event)
    # [RU] Учитывать муты LiteBans в чате, /me и ЛС
    #      (нужно, т.к. ChatSync полностью перехватывает событие чата)
    enabled: true
    # [EN] Block muted players from chatting /me /msg
    # [RU] Блокировать замученных в чате /me /msg
    block_muted: true

# ── /broadcast (server-wide announcements) ──────────────────────
broadcast:
  # [EN] Announcement layout (lines / lines_hidden) lives in lang/<code>.yml
  #      so each language has its own "Announcement from …" text.
  # [RU] Оформление объявления (lines / lines_hidden) — в lang/<code>.yml
  #      у каждого языка свой текст «Объявление от …».
  # [EN] Optional legacy single-line fallback if lang lists are empty
  # [RU] Запасной однострочный формат, если в lang списки пустые
  format: "&eAnnouncement &ffrom &e%sender%"
  format_hidden: "&eAnnouncement"
  # [EN] Show the sender name. Admins can hide via /broadcast hide or -h
  # [RU] Показывать автора. Скрыть: /broadcast hide или -h
  show_sender: true
  # [EN] Also show the announcement in the action bar
  # [RU] Также показывать объявление в панели действий (action bar)
  actionbar: false
  sound:
    # [EN] Play a sound to everyone when an announcement is sent
    # [RU] Проигрывать звук всем при отправке объявления
    enable: true
    name: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0
  title:
    # [EN] Also show the announcement as an on-screen title
    # [RU] Также показывать объявление как заголовок на экране
    enable: false
    # [EN] Title text. Placeholder: %message%
    # [RU] Текст заголовка. Плейсхолдер: %message%
    text: "&e&l%message%"
    # [EN] Subtitle text. Placeholder: %message%
    # [RU] Текст подзаголовка. Плейсхолдер: %message%
    subtitle: ""
  # [EN] Pre-made announcements by key. Use: /broadcast <key>
  #      No confirmation required. Example: /broadcast restart_5m
  # [RU] Заготовки объявлений по ключу. Использование: /broadcast <ключ>
  #      Без подтверждения. Пример: /broadcast restart_5m
  presets:
    restart_5m: "&c&lServer restarting in 5 minutes!"
    restart_1m: "&c&lServer restarting in 1 minute!"
    maintenance: "&e&lServer is under maintenance. Sorry for the inconvenience."


# ── Hover on clickable names ────────────────────────────────────
hover:
  enabled: true
  show_playtime: true

# ══════════════════════════════════════════════════════════════
#  Message toggles
#  [EN] Set any to false to completely disable that message/event.
#  [RU] Установите false, чтобы полностью отключить это сообщение/событие.
# ══════════════════════════════════════════════════════════════
toggles:
  # [EN] "Nobody can hear you" hint when local chat has no recipients
  # [RU] Подсказка "тебя никто не слышит", когда локальный чат без получателей
  local_noone: true

  # [EN] Join / quit messages shown to all players
  # [RU] Сообщения о входе / выходе, видимые всем игрокам
  join_message: true
  quit_message: true

  # [EN] "[Player] is ignoring you" notification when messaging someone who ignored you
  # [RU] Уведомление "[Игрок] игнорирует вас" при попытке написать тому, кто вас игнорирует
  ignore_notify_sender: true

  # [EN] Notification to the player who gets ignored/unignored
  #      (the person running /ignore always sees confirmation — this controls the TARGET's notification)
  # [RU] Уведомление игроку, которого добавили/удалили из игнора
  #      (тот, кто выполняет /ignore, всегда видит подтверждение — это управляет уведомлением ЦЕЛИ)
  ignore_notify_target: false

  # [EN] Sound played on private message receive
  # [RU] Звук при получении личного сообщения
  pm_sound: true

  # [EN] SocialSpy messages for admins
  # [RU] Сообщения SocialSpy для администраторов
  socialspy: true

  # [EN] Console logging for local chat
  # [RU] Логирование локального чата в консоль
  local_console_log: true

  # [EN] Make the victim's (and killer's, if a player) name clickable in death messages, to quickly /msg them
  # [RU] Делать ник погибшего (и убийцы, если это игрок) кликабельным в сообщениях о смерти для быстрого /msg
  clickable_death_name: true

  # [EN] Make the player's name clickable in advancement-announcement messages, to quickly /msg them
  # [RU] Делать ник игрока кликабельным в сообщениях о получении достижений для быстрого /msg
  clickable_advancement_name: true

# ── Vanish (SuperVanish / PremiumVanish / Essentials) ─────────
vanish:
  # [EN] Hide join/quit messages when the player is vanished
  # [RU] Скрывать вход/выход, если игрок в ванише
  hide_join_quit: true

# ── Teams / party chat ────────────────────────────────────────
teams:
  # [EN] Enable team system (/team)
  # [RU] Включить систему команд (/team)
  enabled: true
  permission: "chatsync.team"
  permission_create: "chatsync.team.create"
  permission_admin: "chatsync.team.admin"
  # [EN] Max teams on the server
  # [RU] Макс. число команд на сервере
  max_teams: 50
  # [EN] Max members per team
  # [RU] Макс. участников в команде
  max_members: 8
  # [EN] Max co-owners per team
  # [RU] Макс. совладельцев
  max_co_owners: 3
  max_name_length: 16
  # [EN] Prefix to talk in team chat (e.g. #hello). Also: /team chat <msg>
  # [RU] Символ командного чата (напр. #привет). Также: /team chat <msg>
  chat_symbol: "#"
  invite_timeout: 60
  default_color: "&b"
  allow_color_change: true
  persist: true
  # [EN] Format: %color% %team% %player% %message%
  format: "&8[%color%%team%&8] &f%player%&7: &f%message%"
