name: ChatSync
version: 1.7.3
main: chatsync.ChatSync
api-version: '1.21'
libraries:
  - net.kyori:adventure-api:4.17.0
  - net.kyori:adventure-text-serializer-legacy:4.17.0
  - net.kyori:adventure-text-serializer-plain:4.17.0
  - net.kyori:adventure-text-serializer-gson:4.17.0
softdepend: [PlaceholderAPI, DiscordSRV, LuckPerms, CoreProtect, LiteBans, SuperVanish, PremiumVanish, Essentials, SkinsRestorer]
description: Multifunctional chat plugin — global/local chat, PM, ignore, socialspy, teams, stats, playtime, GUI. Use chatsync-*-arclight.jar on Arclight/Spigot/Mohist; plain jar on Paper/Purpur.
authors: [Mutya660]
website: "https://modrinth.com/plugin/chatsync"

commands:
  msg:
    description: Send a private message
    usage: /msg <player|console> <message>
    aliases: [m, tell, t, w]
  reply:
    description: Reply to the last private message
    usage: /reply <message>
    aliases: [r]
  ignore:
    description: Toggle ignoring a player
    usage: /ignore <player>
  ignorelist:
    description: Show your ignore list
    usage: /ignorelist
    aliases: [ignoredlist, ignored]
  socialspy:
    description: Toggle SocialSpy (staff)
    usage: /socialspy
    permission: chatsync.spy
  chatsync:
    description: ChatSync admin / info / GUI
    usage: /chatsync <info|reload|gui>
    aliases: [csync]
  me:
    description: Emote action message
    usage: /me <action>
  clear:
    description: Clear chat
    usage: /clear [player] [confirm]
    aliases: [clearchat]
  chatstats:
    description: Chat statistics for a player or top list
    usage: /chatstats [player|reset]
    aliases: [cstats, chatstat]
  chatstatstop:
    description: Chat message statistics leaderboard
    usage: /chatstatstop
    aliases: [cstop, chatlb, msgtop]
  broadcast:
    description: Broadcast a message
    usage: /broadcast <message|preset>
    aliases: [bc, alert]
  playtime:
    description: View playtime
    usage: /playtime [player]
    aliases: [pt, played]
  playtimetop:
    description: Playtime leaderboard
    usage: /playtimetop
    aliases: [ptop, playtimelb]
  lastseen:
    description: When a player was last online
    usage: /lastseen <player>
    aliases: [seen]
  team:
    description: Team / party system
    usage: /team <create|invite|accept|deny|leave|kick|disband|chat|name|color|info|transfer|promote|demote>
    aliases: [party, squad]

permissions:
  chatsync.bypass_cooldown:
    description: Bypass global/local chat cooldown
    default: op
  chatsync.admin:
    description: /chatsync reload and admin actions
    default: op
  chatsync.msg.console:
    description: Message the server console via /msg console
    default: op
  chatsync.spy:
    description: /socialspy
    default: op
  chatsync.color:
    description: Use & color codes in chat, /me and /broadcast
    default: op
  chatsync.me:
    description: /me
    default: true
  chatsync.clear:
    description: /clear
    default: op
  chatsync.chatstats:
    description: /chatstats
    default: true
  chatsync.chatstats.others:
    description: /chatstats <player>
    default: op
  chatsync.chatstats.reset:
    description: /chatstats reset
    default: op
  chatsync.chatstatstop:
    description: /chatstatstop
    default: true
  chatsync.broadcast:
    description: /broadcast
    default: op
  chatsync.broadcast.preset:
    description: /broadcast preset management
    default: op
  chatsync.playtime:
    description: /playtime
    default: true
  chatsync.playtimetop:
    description: /playtimetop
    default: true
  chatsync.lastseen:
    description: /lastseen
    default: true
  chatsync.spam.notify:
    description: Receive spam staff alerts
    default: op
  chatsync.spam.bypass:
    description: Bypass spam detection
    default: op
  chatsync.team:
    description: Use /team
    default: true
  chatsync.team.create:
    description: Create a team
    default: true
  chatsync.team.admin:
    description: Team admin bypass
    default: op
  chatsync.gui:
    description: /chatsync gui
    default: true
  chatsync.gui.unmute:
    description: Unignore players from GUI
    default: true
  chatsync.vanish.see:
    description: See vanished players in lastseen/join
    default: op
