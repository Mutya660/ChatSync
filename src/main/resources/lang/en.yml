# ChatSync - English language file
# Locale codes: en_us, en_gb, en_au, en_ca, en_nz

commands:
  reload:
    success: "&a[ChatSync] Configuration reloaded successfully!"
    no_permission: "&c[!] You don't have permission to run this command."
    usage: "&7Usage: &f/chatsync reload"
  msg:
    usage: "&7Usage: &f/msg <player> <message>"
    self: "&cYou can't message yourself."
  reply:
    usage: "&7Usage: &f/reply <message>"
    no_target: "&cNo one to reply to."
    offline: "&cThat player has gone offline."
  ignore:
    usage: "&7Usage: &f/ignore <player>"
    added: "&eYou are now ignoring &f%player%&e."
    removed: "&aYou are no longer ignoring &f%player%&a."
    ignores_you: "&c%player% is ignoring you."
    self: "&cYou can't ignore yourself."
    target_added: "&7%player% &7is now ignoring you."
    target_removed: "&7%player% &7is no longer ignoring you."
  ignorelist:
    empty: "&7Your ignore list is empty."
    header: "&7Ignored players &8(&f%count%&8)&7:"
    entry_prefix: "&f"
  socialspy:
    enabled: "&eSocialSpy &aenabled&e."
    disabled: "&eSocialSpy &cdisabled&e."
    no_permission: "&cYou don't have permission to use SocialSpy."

chat:
  local_noone: "&7[!] Nobody can hear you. Use &f!<message>&7 for global chat."
  cooldown: "&c[!] Wait &f%seconds%s &cbefore sending another global message."
  local_cooldown: "&c[!] Slowmode: wait &f%seconds%s &cbefore sending another message."
  muted: "&c[!] You are muted and cannot chat."

messages:
  join_hover: "&7Click to message &f%player%"
  join_hover_playtime: "&7Click to message &f%player%\n&8Playtime: &e%playtime%"

pm:
  format_sender:   "&eYou &e→ &e%receiver%&e: &e%message%"
  format_receiver: "&e%sender% &e→ &eYou&e: &e%message%"
  player_not_found: "&cPlayer &f%player% &cis not online."
  no_reply_target: "&cYou have nobody to reply to."

me:
  usage: "&7Usage: &f/me <action>"
  no_permission: "&cYou don't have permission to use /me."

clear:
  no_permission: "&cYou don't have permission to clear the chat."
  confirm_hint: "&eThis will clear the chat for &feveryone&e. Click here or type &f/clear confirm &eto proceed."
  confirm_hint_player: "&eThis will clear the chat view of &f%target%&e. Click here or type &f/clear %target% confirm &eto proceed."
  expired: "&cNothing to confirm, or the confirmation expired. Run the command again."
  done_all: "&aChat cleared by &f%player%&a."
  done_player: "&aChat cleared for &f%target% &aby &f%player%&a."

chatstats:
  empty: "&7No chat stats yet. Send a message in chat (&f!message&7 for global)."
  no_permission: "&cYou don't have permission to view chat statistics."
  no_permission_others: "&cYou don't have permission to view other players' statistics."
  no_data: "&cNo chat statistics found for &f%player%&c."
  top_header: "&e&lTop chatters &8(&ftop %count%&8)&e:"
  top_entry: "&7#%rank% &f%player% &8— &e%total% &7messages"
  player_header: "&e&lChat stats: &f%player%"
  player_line: "&7Global: &f%global%  &7Local: &f%local%  &7PMs: &f%pm%  &7/me: &f%me%  &7BC: &f%broadcast%  &7Total: &e%total%"
  reset_usage: "&7Usage: &f/chatstats reset <player|all> [confirm]"
  reset_no_permission: "&cYou don't have permission to reset chat statistics."
  reset_all_confirm: "&e&lThis will RESET ALL chat statistics. Click here or type &f/chatstats reset all confirm &eto confirm."
  reset_expired: "&cNothing to confirm, or the confirmation expired. Run the command again."
  reset_all_done: "&a&lAll chat statistics have been reset."
  reset_player_done: "&aChat statistics for &f%player% &ahave been reset."

broadcast:
  lines:
    - " "
    - "&eAnnouncement &ffrom &e%sender%"
    - "&f%message%"
    - " "
  lines_hidden:
    - " "
    - "&eAnnouncement"
    - "&f%message%"
    - " "
  usage: "&7Usage: &f/broadcast <message|preset|hide|-h>"
  usage_hide: "&7Hide author: &f/broadcast -h <message|preset>"
  no_permission: "&cYou don't have permission to broadcast announcements."
  preset_empty: "&cPreset &f%preset% &cis empty."
  preset_usage: "&7Usage: &f/broadcast preset list|set <key> <text>|remove <key>"
  preset_empty_list: "&7No broadcast presets configured."
  preset_list_header: "&e&lBroadcast presets:"
  preset_saved: "&aPreset &f%preset% &asaved: &f%message%"
  preset_removed: "&aPreset &f%preset% &aremoved."
  preset_not_found: "&cPreset &f%preset% &cnot found."
  preset_invalid_key: "&cInvalid key. Use letters, digits, _ and -."
  hide_on: "&eBroadcast author is now &chidden&e. Toggle: &f/broadcast hide"
  hide_off: "&eBroadcast author is now &avisible&e. Hide: &f/broadcast hide"

playtime:
  disabled: "&cPlaytime tracking is disabled."
  no_permission: "&cYou don't have permission to view playtime."
  top_no_permission: "&cYou don't have permission to view the playtime leaderboard."
  lastseen_no_permission: "&cYou don't have permission to use /lastseen."
  usage: "&7Usage: &f/playtime [player]"
  lastseen_usage: "&7Usage: &f/lastseen <player>"
  self: "&aYour playtime: &f%time%"
  other: "&aPlaytime of &f%player%&a: &f%time%"
  no_data: "&cNo playtime data for &f%player%&c."
  top_header: "&e&lPlaytime leaderboard &8(&ftop %count%&8)&e:"
  top_entry: "&7#%rank% &f%player% &8— &e%time%"
  lastseen: "&7%player% &7was last online: &f%when%"
  lastseen_online: "&a%player% &ais currently online."
