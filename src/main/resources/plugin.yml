name: ChatSync
version: 1.1
main: chatsync.ChatSync
api-version: '1.21'
softdepend: [PlaceholderAPI, DiscordSRV, LuckPerms, CoreProtect]
description: "Chat plugin with global/local chat, private messages, ignore, socialspy, /me, /clear, /chatstats, /broadcast and multi-language support."
authors: [YourName]
website: "https://modrinth.com/plugin/chatsync"

commands:
  msg:
    description: Send a private message to a player
    usage: /msg <player> <message>
    aliases: [m, tell, t, w]
  reply:
    description: Reply to your last private message
    usage: /reply <message>
    aliases: [r]
  ignore:
    description: Toggle ignoring a player
    usage: /ignore <player>
  ignorelist:
    description: Show your ignore list
    usage: /ignorelist
    aliases: [ignoredlist, ignored]
  socialspy:
    description: Toggle viewing all private messages (staff only)
    usage: /socialspy
    permission: chatsync.spy
  chatsync:
    description: ChatSync admin commands
    usage: /chatsync reload
    aliases: [csync]
    permission: chatsync.admin
  me:
    description: Send a roleplay-style message in the third person
    usage: /me <action>
    aliases: [action]
  clear:
    description: Clear the chat for everyone or a specific player (asks for confirmation)
    usage: /clear [player] [confirm]
    aliases: [clearchat, chatclear]
  chatstats:
    description: View chat message statistics (top players or a specific player)
    usage: /chatstats [player]
    aliases: [cstats]
  broadcast:
    description: Send a server-wide announcement
    usage: /broadcast <message>
    aliases: [bc, announce, alert]
  playtime:
    description: View your own or another player's playtime
    usage: /playtime [player]
    aliases: [ ptime ]
    playtimetop:
      description: Show the playtime leaderboard
      usage: /playtimetop
      aliases: [ ptop, playtimelb ]
    lastseen:
      description: Check when a player was last online
      usage: /lastseen <player>
      aliases: [ seen ]

permissions:
  chatsync.bypass_cooldown:
    description: Bypass the global chat cooldown
    default: op
  chatsync.admin:
    description: Access to /chatsync reload
    default: op
  chatsync.spy:
    description: Access to /socialspy
    default: op
  chatsync.color:
    description: Use & color codes in chat, /me and /broadcast
    default: op
  chatsync.me:
    description: Access to /me
    default: true
  chatsync.clear:
    description: Access to /clear
    default: op
  chatsync.chatstats:
    description: View the chat statistics leaderboard and your own stats
    default: true
  chatsync.chatstats.others:
    description: View other players' chat statistics via /chatstats <player>
    default: op
  chatsync.broadcast:
    description: Access to /broadcast
    default: op
  chatsync.playtime:
    description: Access to /playtime (yourself and other players)
    default: true
    chatsync.playtimetop:
      description: Access to /playtimetop
      default: true
    chatsync.lastseen:
      description: Access to /lastseen
      default: true
